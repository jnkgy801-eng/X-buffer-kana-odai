name: FANZA → はてなブログ 自動投稿

on:
  # ─── 手動実行（GitHub Actions画面から実行できる）───
  workflow_dispatch:
    inputs:
      dmm_floor:
        description: 'フロア種別'
        required: false
        default: 'videoa'
        type: choice
        options:
          - videoa   # AV動画（デフォルト）
          - videoc   # 素人・個人撮影
          - anime    # アニメ
          - doujin   # 同人
          - comic    # 漫画
      dmm_sort_mode:
        description: 'ソートモード'
        required: false
        default: 'rank'
        type: choice
        options:
          - rank   # 人気順（デフォルト・購入されやすい商品を優先）
          - date   # 新着順（新作を優先）
      dmm_price_range:
        description: '価格フィルター'
        required: false
        default: 'all'
        type: choice
        options:
          - all          # すべての価格
          - 0-999        # 999円以下
          - 1000-1999    # 1000〜1999円
          - 2000-2999    # 2000〜2999円
          - 3000-4999    # 3000〜4999円
      blog_post_limit:
        description: '1回の実行で投稿する記事数（多すぎるとスパム判定のリスクあり）'
        required: false
        default: '5'
        type: string
      blog_draft:
        description: '下書き保存のみ（公開しない）：内容確認したい時にONにする'
        required: false
        default: false
        type: boolean

  # ─── 自動実行スケジュール（毎日1時間に１回）───
  # 朝夜2回×5件=1日10件投稿。記事数を早く積み増すための設定。
  # はてなのスパム判定を避けるため、1回あたり5件以内・間隔は最低6時間以上空ける
  schedule:
    - cron: '23 * * * *'    # UTC 0:00  

# 投稿履歴ファイル（posted_history.json）をリポジトリにコミットするために必要
permissions:
  contents: write

jobs:
  blog-post:
    runs-on: ubuntu-latest

    # 同時に複数のワークフローが走って履歴ファイルが競合しないようにする
    concurrency:
      group: hatena-blog-post
      cancel-in-progress: false

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 取得開始番号をランダム設定
        id: set_start
        run: |
          RAND=$(python3 -c "import random; print(random.randint(1, 300))")
          echo "start_index=$RAND" >> $GITHUB_OUTPUT
          echo "🎲 取得開始番号: $RAND"

      - name: はてなブログに記事を投稿
        env:
          # ─── DMM API（既存のSecretsをそのまま使う）───
          DMM_API_ID:       ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          # ─── はてなブログ ───
          HATENA_ID:        ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID:   ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY:   ${{ secrets.HATENA_API_KEY }}
          HATENA_BLOG_BASE_URL: ${{ secrets.HATENA_BLOG_BASE_URL }}
          # ─── 実行パラメータ ───
          # スケジュール実行時はデフォルト値が使われる（手動実行時はUI入力値が優先）
          DMM_FLOOR:        ${{ github.event.inputs.dmm_floor || 'videoa' }}
          DMM_SORT_MODE:    ${{ github.event.inputs.dmm_sort_mode || 'rank' }}
          DMM_PRICE_RANGE:  ${{ github.event.inputs.dmm_price_range || 'all' }}
          BLOG_POST_LIMIT:  ${{ github.event.inputs.blog_post_limit || '5' }}
          BLOG_DRAFT:       ${{ github.event.inputs.blog_draft || 'false' }}
          POST_START_INDEX: ${{ steps.set_start.outputs.start_index }}
          POSTED_HISTORY_PATH: posted_history.json
        run: python dmm_blog_post_generator.py

      # ─── 投稿履歴ファイルをリポジトリにコミット（重複投稿防止のため永続化）───
      - name: 投稿履歴をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain posted_history.json 2>/dev/null)" ]; then
            git add posted_history.json
            git commit -m "chore: 投稿履歴を更新 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "✅ 投稿履歴をコミットしました"
          else
            echo "ℹ️ 投稿履歴に変更なし（新規投稿なし、または下書きモード）"
          fi
